<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{be/layout}">

<section layout:fragment="content">
    <!-- check if has error -->
    <div th:if="${success_message}">
        <div class="alert alert-success" role="alert">
            <div th:text="${success_message}"></div>
        </div>
    </div>

    <div th:if="${error_message}">
        <div class="alert alert-danger" role="alert">
            <div th:text="${error_message}"></div>
        </div>
    </div>

    <form th:method="POST" th:object="${dto}"> <!--begin::Body-->
        <div class="card-body">
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Email address</label>
                <input type="email" th:field="*{email}" class="form-control" id="exampleInputEmail1"
                       aria-describedby="emailHelp">
            </div>

            <div class="mb-3"><label for="exampleInputPassword1" class="form-label">Password</label>
                <input
                        type="password" th:field="*{password}" class="form-control" id="exampleInputPassword1"></div>

            <div class="mb-3"><label for="inputFullName" class="form-label">Full Name</label>
                <input
                        type="text" th:field="*{fullName}" class="form-control" id="inputFullName"></div>

            <div class="mb-3"><label for="inputPhone" class="form-label">Phone</label>
                <input
                        type="text" th:field="*{phone}" class="form-control" id="inputPhone"></div>

            <div class="mb-3"><label for="inputAddress" class="form-label">Address</label> <input
                    type="text" class="form-control" th:field="*{address}" id="inputAddress"></div>

            <div class="mb-3">
                <label class="form-label">Role</label>
                <select class="form-control" th:field="*{role}">
                    <option value="1">Admin</option>
                    <option value="2">User</option>
                </select>
            </div>
        </div> <!--end::Body--> <!--begin::Footer-->
        <div class="card-footer">
            <button type="submit" class="btn btn-primary">Submit</button>
        </div> <!--end::Footer-->
    </form>
</section>

</html>
