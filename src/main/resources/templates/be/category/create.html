<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{be/layout}">

<section layout:fragment="content">
    <!-- check if has error -->
    <div th:if="${success_message}">
        <div class="alert alert-success" role="alert">
            <div th:text="${success_message}"></div>
        </div>
    </div>

    <div th:if="${error_message}">
        <div class="alert alert-danger" role="alert">
            <div th:text="${error_message}"></div>
        </div>
    </div>

    <form th:method="POST" th:object="${dto}"> <!--begin::Body-->
        <div class="card-body">
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Name</label>
                <input type="text" th:field="*{name}" class="form-control" id="exampleInputEmail1"
                       aria-describedby="emailHelp">
            </div>

            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Description</label>
                <input type="text" th:field="*{description}" class="form-control" id="exampleInputEmail1"
                       aria-describedby="emailHelp">
            </div>

        </div> <!--end::Body--> <!--begin::Footer-->
        <div class="card-footer">
            <button type="submit" class="btn btn-primary">Submit</button>
        </div> <!--end::Footer-->
    </form>
</section>

</html>
